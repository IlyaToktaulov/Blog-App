<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog-App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    
    <div class="blog">
        <div class="column">
            <h2>Новый пост</h2>
            <input id="title-input" class="post-title-input" placeholder="Заголовок" type="text">
            <textarea id="description" class="post-text-input" placeholder="Описание" type="text"></textarea>
            <button id="post-btn" class="new-post-btn">Опубликовать</button>
            <p id="error"></p>
        </div>

        <div class="column">
            <h2>Лента</h2>
            <div id="posts"></div>
        </div>
    </div>





    <script src="model.js"></script>
    <script src="veiw.js"></script>
    <script src="api.js"></script>
    <script src="controller.js"></script>
    <script src="index.js"></script>
</body>
</html>
