<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>

    <div class="blog">
        <div class="column">
            <h2>Новый пост</h2>
            <input class="js-post-title-input post-title-input" type="text">
            <input class="js-post-text-input post-text-input" type="text">
            <button class="js-new-post-btn new-post-btn">Опубликовать</button>
        </div>

        <div class="column">
            <h2>Посты</h2>
            <div class="js-posts posts">
                Лента пустая...
            </div>
        </div>
    </div>


    <script src="script.js"></script>
</body>
</html>
